services:
  - type: web
    name: mindyourlanguage
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run import-cedict && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NATIVE_ALT_MODEL
        value: gpt-5.6-luna
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: CEDICT_FETCH
        value: "1"
      # Phase 6: Neon direct URL with sslmode=require (Dashboard secret)
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
