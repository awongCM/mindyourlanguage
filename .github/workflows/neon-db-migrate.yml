# Apply Neon Postgres migrations when Render Shell is unavailable (e.g. free tier).
#
# Setup (once):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: DATABASE_URL
#   Value: same Neon *direct* URL as Render (include ?sslmode=require)
#
# Run: Actions → "Neon database migrate" → Run workflow

name: Neon database migrate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'scripts/run-migrations.ts'

permissions:
  contents: read

concurrency:
  group: neon-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply SQL migrations to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
