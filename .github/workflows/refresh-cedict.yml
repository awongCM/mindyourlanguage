# Monthly CEDICT refresh via Render deploy hook.
# Scheduled workflows run from the default branch after merge.
# Requires repo secret RENDER_DEPLOY_HOOK_URL (Render Dashboard → service → Settings → Deploy Hook).

name: Refresh CEDICT

on:
  schedule:
    # 04:00 UTC on the 1st of each month
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-cedict
  cancel-in-progress: false

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: npx --yes tsx@4.23.1 scripts/trigger-render-deploy.ts
